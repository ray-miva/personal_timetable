<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間割</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My 時間割</h1>
        
        <div class="status-panel">
            <div class="status-item">
                <span class="label">現在時刻:</span>
                <span id="current-time" class="value">--:--</span>
            </div>
            <div class="status-item">
                <span class="label">現在の授業:</span>
                <span id="current-class" class="value">--</span>
            </div>
            <div class="status-item">
                <span class="label">次の授業:</span>
                <span id="next-class" class="value">--</span>
            </div>
        </div>

        <div class="table-wrapper">
        <table id="timetable">
            <thead>
                <tr>
                    <th class="time-col">時間</th>
                    <th>月</th>
                    <th>火</th>
                    <th>水</th>
                    <th>木</th>
                    <th>金</th>
                <th>土</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
        </table>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
